name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Refuse a tag that disagrees with the project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(mvn --batch-mode --quiet -DforceStdout \
            help:evaluate -Dexpression=project.version)"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match project.version $version" >&2
            exit 1
          fi

      - name: Verify
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Check publishing credentials
        id: creds
        run: |
          if [ -n "${{ secrets.MAVEN_CENTRAL_USERNAME }}" ] && [ -n "${{ secrets.MAVEN_GPG_PRIVATE_KEY }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Maven Central secrets not configured - skipping publish."
          fi

      - name: Publish to Maven Central
        if: steps.creds.outputs.present == 'true'
        run: mvn --batch-mode --no-transfer-progress -P release -DskipTests deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
